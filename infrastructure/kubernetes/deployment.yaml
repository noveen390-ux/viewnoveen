apiVersion: v1
kind: Namespace
metadata:
  name: viewnoveen
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: viewnoveen-config
  namespace: viewnoveen
data:
  NODE_ENV: production
  API_GATEWAY_PORT: "4000"
  CORS_ORIGIN: "https://viewnoveen.com"
  STORAGE_PROVIDER: s3
  AWS_REGION: us-east-1
  STUN_SERVER: stun.l.google.com:19302
---
apiVersion: v1
kind: Secret
metadata:
  name: viewnoveen-secrets
  namespace: viewnoveen
type: Opaque
stringData:
  DATABASE_URL: postgresql://viewnoveen:${DB_PASSWORD}@postgres-service:5432/viewnoveen
  REDIS_URL: redis://redis-service:6379
  JWT_SECRET: ${JWT_SECRET}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: viewnoveen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: viewnoveen
        - name: POSTGRES_USER
          value: viewnoveen
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: viewnoveen-secrets
              key: DB_PASSWORD
        volumeMounts:
        - name: postgres-storage
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-storage
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: viewnoveen
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: viewnoveen
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
        args: ["--appendonly", "yes"]
        volumeMounts:
        - name: redis-storage
          mountPath: /data
      volumes:
      - name: redis-storage
        persistentVolumeClaim:
          claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: viewnoveen
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viewnoveen-api
  namespace: viewnoveen
spec:
  replicas: 3
  selector:
    matchLabels:
      app: viewnoveen-api
  template:
    metadata:
      labels:
        app: viewnoveen-api
    spec:
      containers:
      - name: api
        image: viewnoveen/api:latest
        ports:
        - containerPort: 4000
        envFrom:
        - configMapRef:
            name: viewnoveen-config
        - secretRef:
            name: viewnoveen-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: viewnoveen-api-service
  namespace: viewnoveen
spec:
  selector:
    app: viewnoveen-api
  ports:
  - port: 4000
    targetPort: 4000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: viewnoveen-web
  namespace: viewnoveen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: viewnoveen-web
  template:
    metadata:
      labels:
        app: viewnoveen-web
    spec:
      containers:
      - name: web
        image: viewnoveen/web:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: viewnoveen-config
        - secretRef:
            name: viewnoveen-secrets
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: viewnoveen-web-service
  namespace: viewnoveen
spec:
  selector:
    app: viewnoveen-web
  ports:
  - port: 3000
    targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: viewnoveen-ingress
  namespace: viewnoveen
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "2g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "86400"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "86400"
spec:
  tls:
  - hosts:
    - viewnoveen.com
    - api.viewnoveen.com
    secretName: viewnoveen-tls
  rules:
  - host: viewnoveen.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: viewnoveen-web-service
            port:
              number: 3000
  - host: api.viewnoveen.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: viewnoveen-api-service
            port:
              number: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: viewnoveen-api-hpa
  namespace: viewnoveen
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: viewnoveen-api
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: viewnoveen-api-pdb
  namespace: viewnoveen
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: viewnoveen-api
